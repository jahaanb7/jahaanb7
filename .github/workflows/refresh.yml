name: Refresh profile cards

on:
  schedule:
    - cron: '17 6 * * *' # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/refresh.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the cards changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card-*.svg assets/stats-*.svg
          git diff --cached --quiet || (git commit -m "Refresh profile cards" && git push)
